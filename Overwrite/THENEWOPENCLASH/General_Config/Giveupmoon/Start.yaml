# ==========================================================
# rules（从源文件直接提取）
# ----------------------------------------------------------
# 原始规则列表，默认注释不启用。
# 常用操作：
#   +rules: [...]   在规则列表开头插入（优先匹配）
#   rules+: [...]   在规则列表末尾追加
#   rules!: [...]   强制替换整个规则列表（丢弃原有规则）
# 参考上方示例，通常不需要取消注释整个 rules，而是用 +rules/rules+ 追加即可。
# ==========================================================
#
# rules:
# - RULE-SET,Private,全球直连
# - RULE-SET,Private-IP,全球直连,no-resolve
# - RULE-SET,Custom_Direct_Domain,全球直连
# - RULE-SET,Custom_Direct_IP,全球直连,no-resolve
# - RULE-SET,Custom_Proxy_Domain,手动选择
# - RULE-SET,Custom_Proxy_IP,手动选择,no-resolve
# - RULE-SET,Category-Games-cn,全球直连
# - RULE-SET,Steam_CDN_Domain,全球直连
# - RULE-SET,Steam_CDN_IP,全球直连,no-resolve
# - RULE-SET,Category-Game-Platforms-Download,全球直连
# - RULE-SET,Category-Public-Tracker,全球直连
# - RULE-SET,Category-Communication,即时通讯
# - RULE-SET,Category-Social-Media,社交媒体
# - RULE-SET,OpenAI,ChatGPT
# - RULE-SET,Google-Gemini,Gemini
# - RULE-SET,Category-AI,AI服务
# - RULE-SET,Github,GitHub
# - RULE-SET,Category-Speedtest,测速工具
# - RULE-SET,Steam,Steam
# - RULE-SET,Youtube,YouTube
# - RULE-SET,Apple-TV,AppleTV+
